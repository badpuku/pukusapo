name: Reservation Collector

on:
  workflow_dispatch: # 手動実行を可能にする
    inputs:
      environment:
        description: "Environment to run against"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - staging
  # schedule:
  #   - cron: '0 9 * * *'  # 毎日9時（UTC）= 日本時間18時

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # タイムアウト設定（安全のため）

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Load accounts configuration
        run: |
          echo "${{ secrets.ACCOUNTS_JSON }}" > accounts.json
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}

      - name: Run collector
        run: npm run collect
        env:
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          NODE_ENV: ${{ inputs.environment }}

      - name: Cleanup accounts file
        if: always()
        run: rm -f accounts.json

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-logs
          path: |
            logs/
            screenshots/
          retention-days: 7
