name: Deploy Backend (staging)

on:
  push:
    branches:
      - deployment/development
      # TODO: PR #143 マージ後に削除（動作確認用の一時トリガー）
      - 'feature/#142_deploy-backend'
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-dev.yml'

defaults:
  run:
    working-directory: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    env:
      KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      KAMAL_REGISTRY_IMAGE: ${{ secrets.KAMAL_REGISTRY_IMAGE }}
      KAMAL_SERVER_IP_ADDRESS: ${{ secrets.KAMAL_SERVER_IP_ADDRESS }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.KAMAL_SERVER_IP_ADDRESS }} >> ~/.ssh/known_hosts

      # TODO: HostKeyMismatch の原因特定後に削除
      - name: Debug SSH host keys
        run: |
          echo "=== known_hosts contents ==="
          cat ~/.ssh/known_hosts
          echo
          echo "=== ssh-keyscan (no -H, all types) re-run for comparison ==="
          ssh-keyscan -t rsa,ecdsa,ed25519 ${{ secrets.KAMAL_SERVER_IP_ADDRESS }} 2>&1 || true
          echo
          echo "=== Each key's fingerprint ==="
          ssh-keyscan -t rsa,ecdsa,ed25519 ${{ secrets.KAMAL_SERVER_IP_ADDRESS }} 2>/dev/null | ssh-keygen -lf - || true

      - name: Deploy with Kamal
        run: bundle exec kamal deploy -d staging
