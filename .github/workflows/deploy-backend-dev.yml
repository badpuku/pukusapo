name: Deploy Backend (staging)

on:
  push:
    branches:
      - deployment/development
      # TODO: PR #143 マージ後に削除（動作確認用の一時トリガー）
      - 'feature/#142_deploy-backend'
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-dev.yml'

defaults:
  run:
    working-directory: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    env:
      KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      KAMAL_REGISTRY_IMAGE: ${{ secrets.KAMAL_REGISTRY_IMAGE }}
      KAMAL_SERVER_IP_ADDRESS: ${{ secrets.KAMAL_SERVER_IP_ADDRESS }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 ${{ secrets.KAMAL_SERVER_IP_ADDRESS }} >> ~/.ssh/known_hosts

      # TODO: 切り分け後に削除
      - name: Debug RAILS_MASTER_KEY length
        run: |
          if [ -z "${RAILS_MASTER_KEY}" ]; then
            echo "RAILS_MASTER_KEY is EMPTY"
          else
            echo "Length: ${#RAILS_MASTER_KEY}"
          fi

      - name: Deploy with Kamal
        run: bundle exec kamal deploy -d staging
